name = "ni-ventas-tracker"
main = "worker.js"
compatibility_date = "2026-05-01"

# Variables de entorno (no secretos). Los secretos se setean con `wrangler secret put`.
[vars]
WA_PHONE_NUMBER_ID = "919964037861500"
WA_API_VERSION = "v25.0"
WA_BUSINESS_ACCOUNT_ID = "800446462838166"
# Número del business en formato E.164 sin "+" (solo dígitos). Usado para detectar
# mensajes echoes (los que Joaco manda desde la app de WA Business) cuando el
# webhook de 360dialog no incluye metadata.display_phone_number.
WA_BUSINESS_PHONE = "5491144366573"
# URL del Apps Script "Cotizador Writer" — la usa el worker para leer la hoja
# COGS del Excel 2026v4 (proxy server-to-server, evita CORS en el front).
# Misma URL que CONFIG.appsScriptUrl en app.js. No es secreta.
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9Jq2ew0dMcg5IEXn9OMsqhdVmlwqL_EVULlclWK-oIxh5avOlnZxRrGtis1sGalnd/exec"

# La D1 binding se completa con el ID que devuelve `wrangler d1 create`.
[[d1_databases]]
binding = "DB"
database_name = "ni-ventas"
database_id = "bf9f0a63-0a68-45bd-b65b-d78ab61f0924"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ni-ventas-media"

# Cron Triggers:
# - "*/5 * * * *" (cada 5 min): tareas normales — mensajes programados,
#   follow-ups de presupuestos (horario AR), followups Apps Script (13:00 UTC),
#   monitor de templates + análisis IA (1x/hora con minute<5).
# - "* * * * *" (cada 1 min): SOLO la cola de auto-respuestas del minicurso,
#   para que la demora configurada (~1 min) salga en ~1-2 min y no hasta 6.
[triggers]
crons = ["*/5 * * * *", "* * * * *"]
