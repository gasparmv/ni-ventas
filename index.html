<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Viewport: en mobile portrait mostramos width=device-width para que la app
     ocupe la pantalla; en desktop el min-width del CSS mantiene el layout. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
<title>NEON · Ventas</title>
<meta name="theme-color" content="#0A0A0F">
<meta name="description" content="CRM y Dashboard de Neon Infinito — pedidos, presupuestos, follow-ups y chat WhatsApp.">

<!-- === PWA — Web Manifest === -->
<link rel="manifest" href="manifest.webmanifest">

<!-- === iOS — Standalone (Add to Home Screen) === -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEON">
<meta name="format-detection" content="telephone=no">

<!-- Apple touch icons (iOS los usa para la home screen) -->
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="assets/icon-512.png">

<!-- (splash screen iOS removido: el PNG referenciado no existía → daba 404 en cada carga) -->

<!-- Open Graph (preview en WhatsApp, Twitter, Discord, Slack, etc.) -->
<meta property="og:type" content="website">
<meta property="og:title" content="NEON Infinito · CRM Ventas">
<meta property="og:description" content="Dashboard interno: pedidos, presupuestos, follow-ups automáticos y chat WhatsApp en un solo lugar.">
<meta property="og:image" content="https://neoninfinitosoftware.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:url" content="https://neoninfinitosoftware.com/">
<meta name="twitter:card" content="summary_large_image">

<!-- Preconnect a orígenes críticos (acelera la 1ª conexión: DNS+TLS por adelantado). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://ni-ventas-tracker.neoninfinito.workers.dev" crossorigin>
<!-- Fuentes async (antes venían por @import dentro de brand.css = cascada bloqueante).
     media="print" + onload las baja sin bloquear el primer dibujado; display=swap da fallback. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="assets/brand.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">

<script>
// === Service Worker registration ===
// Permite que la PWA cachee assets y siga abriendo sin internet.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => console.log('SW registered', reg.scope))
      .catch(err => console.log('SW failed', err));
  });
}

// === Detección de modo standalone (iOS PWA) ===
// Sirve para ajustar UI (safe-areas, status bar) cuando está corriendo como app.
if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
  document.documentElement.classList.add('pwa-standalone');
}
</script>
</head>
<body>
<div id="app" class="app">
  <div class="loading"><div class="spinner"></div></div>
</div>
<!-- opus-recorder: graba notas de voz en ogg/opus (compatible WhatsApp en todos
     los navegadores, incluido Chrome que solo grabaría webm con MediaRecorder).
     SELF-HOSTED (no CDN): iOS Safari bloquea cargar el encoderWorker como Worker
     cross-origin → caía al grabador nativo (m4a) y WhatsApp lo mostraba como
     ARCHIVO en vez de nota de voz. Sirviéndolo del mismo origen, iOS lo carga
     bien y siempre graba ogg/opus → nota de voz nativa. -->
<script src="assets/opus-recorder.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
